name: Publish

on:
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    environment:
      name: release
      url: "https://rubygems.org/gems/onboardable/versions/${{ steps.version.outputs.version }}"
    permissions:
      contents: write
      id-token: write
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7
      - name: 'Set up Ruby'
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          ruby-version: ruby
      - name: 'Read gem version'
        id: version
        run: echo "version=$(ruby -r ./lib/onboardable/version -e 'puts Onboardable::VERSION')" >> "$GITHUB_OUTPUT"
      - name: 'Run the default task'
        run: bundle exec rake
      - name: 'Release Gem'
        uses: rubygems/release-gem@v1
