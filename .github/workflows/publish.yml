name: Publish

on:
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    environment:
      name: release
      url: "https://rubygems.org/gems/onboardable/versions/${{ steps.version.outputs.version }}"
    permissions:
      contents: write
      id-token: write
    steps:
      - name: 'Checkout'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 'Set up Ruby'
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          bundler-cache: true
          ruby-version: ruby
      - name: 'Read gem version'
        id: version
        run: echo "version=$(ruby -r ./lib/onboardable/version -e 'puts Onboardable::VERSION')" >> "$GITHUB_OUTPUT"
      - name: 'Run the default task'
        run: bundle exec rake
      - name: 'Release Gem'
        uses: rubygems/release-gem@7f9650160c1a4e7989fdc9855807bdbd421d8b6b # v1.4.1
