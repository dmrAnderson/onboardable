name: Publish

on:
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    environment:
      name: release
      url: "https://rubygems.org/gems/onboardable/versions/${{ steps.version.outputs.version }}"
    permissions:
      contents: write
      id-token: write
    steps:
      - name: 'Checkout'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 'Set up Ruby'
        uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          bundler-cache: true
          ruby-version: ruby
      - name: 'Read gem version'
        id: version
        run: echo "version=$(ruby -r ./lib/onboardable/version -e 'puts Onboardable::VERSION')" >> "$GITHUB_OUTPUT"
      - name: 'Run the default task'
        run: bundle exec rake
      - name: 'Release Gem'
        uses: rubygems/release-gem@2654a0fe0dc39725c07fe84d7fe863a084f2424e # v1.5.0
